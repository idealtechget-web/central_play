<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Cliente - IdealTech</title>
  
  <!-- Favicon com Emoji -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpolygon points='128,20 236,82 236,174 128,236 20,174 20,82' fill='none' stroke='%23ffffff' stroke-width='24' stroke-linejoin='round'/%3E%3Crect x='70' y='76' width='26' height='104' fill='%23ffffff' rx='4'/%3E%3Crect x='110' y='76' width='76' height='26' fill='%23ffffff' rx='4'/%3E%3Crect x='135' y='102' width='26' height='78' fill='%23ffffff' rx='4'/%3E%3C/svg%3E">

  <style>
    /* ===== VARIÁVEIS ===== */
    :root {
      --bg-card: #141d2d;
      --bg-body: #0a0f1d;
      --border-color: #1e2a3e;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --text-light: #cbd5e1;
      --text-muted: #94a3b8;
      --bg-btn: #233146;
      --bg-input: #0d1524;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      --radius: 12px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ===== RESET E BASE ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 30% 10%, #111a2e 0%, var(--bg-body) 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    /* ===== WIDGET DO TOPO (RELÓGIO) ===== */
    .top-bar {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
    }

    .glass-widget {
      background: rgba(20, 29, 45, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      color: var(--text-light);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-widget .clock {
      color: #fff;
      font-weight: 600;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .time-widget .date {
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 12px;
      text-transform: capitalize;
    }

    /* ===== CARD PRINCIPAL ===== */
    .card {
      background: rgba(20, 29, 45, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      border-radius: var(--radius);
      border: 1px solid rgba(30, 42, 62, 0.6);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.3s;
    }
    .card:hover {
      box-shadow: 0 10px 50px rgba(59, 130, 246, 0.15);
    }

    /* ===== CABEÇALHO ===== */
    .header-fixo {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      text-align: center;
    }

    .logo-area { display: flex; flex-direction: column; line-height: 1.2; align-items: center; }
    .logo { font-weight: 800; font-size: 1.8rem; letter-spacing: 1.5px; color: #fff; }
    .logo span { color: var(--primary); }
    .sub-logo { font-size: 0.7rem; letter-spacing: 3px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-top: 4px; }

    /* ===== CONTEÚDO DA BUSCA ===== */
    .busca-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .titulo-busca {
      font-size: 1.15rem;
      color: #fff;
      text-align: center;
      margin-bottom: 2px;
    }

    .descricao-busca {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    /* ===== INPUTS E DICA ===== */
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #28374d;
      background: var(--bg-input);
      color: #fff;
      font-size: 1.1rem;
      outline: none;
      text-align: center;
      transition: all var(--transition);
      letter-spacing: 1px;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      background: #0f1a2b;
    }
    input[type="text"]::placeholder { color: #4a5a7a; font-weight: 300; letter-spacing: normal; }

    .dica-usuario {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      font-style: italic;
      margin-top: -4px;
      margin-bottom: 8px;
    }
    .dica-usuario strong {
      color: var(--text-muted);
    }

    /* ===== BOTÕES ===== */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px;
      background: var(--bg-btn);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid #33435c;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition);
      gap: 8px;
    }
    
    .btn-destaque {
      background: #1e3a8a;
      border-color: var(--primary);
      animation: pulse-glow 2.5s infinite;
    }
    .btn-destaque:hover {
      background: var(--primary-dark);
      border-color: #60a5fa;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
      transform: translateY(-2px);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.3); }
      50% { box-shadow: 0 0 20px 4px rgba(59, 130, 246, 0.15); }
    }

    .btn-esqueci-dados {
      background: transparent;
      border: 1px dashed #475569;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      width: 100%;
      cursor: pointer;
      margin-top: 5px;
      display: block;
      text-decoration: none;
      transition: all var(--transition);
    }
    .btn-esqueci-dados:hover {
      border-color: var(--primary);
      color: #fff;
      background: rgba(59, 130, 246, 0.05);
    }

    /* ===== RESPONSIVIDADE ===== */
    @media (max-width: 480px) {
      .top-bar { position: relative; top: 0; right: 0; justify-content: center; margin-bottom: 20px; }
      .card { margin-top: 0; border-radius: 0; border: none; box-shadow: none; padding: 20px 16px; background: transparent; backdrop-filter: none; }
      body { padding: 0; justify-content: flex-start; }
    }
  </style>
</head>
<body>

<!-- BARRA SUPERIOR (Relógio Global) -->
<div class="top-bar">
  <div class="glass-widget time-widget">
    <span class="clock" id="liveClock">00:00:00</span>
    <span class="date" id="liveDate">Carregando...</span>
  </div>
</div>

<div class="card">
  <!-- ===== CABEÇALHO ===== -->
  <div class="header-fixo">
    <div class="logo-area">
      <div class="logo">IDEAL<span>TECH</span></div>
      <div class="sub-logo">CENTRAL DE ASSINANTES</div>
    </div>
  </div>

  <!-- ===== ÁREA DE BUSCA ===== -->
  <div class="busca-container">
    <h2 class="titulo-busca">Consultar Usuário</h2>
    <p class="descricao-busca">Digite seu código de usuário abaixo para acessar seu painel de renovação e credenciais.</p>
    
    <input type="text" id="input-usuario" placeholder="Ex: 471234" maxlength="20" onkeypress="verificarEnter(event)">
    
    <!-- Dica discreta adicionada aqui -->
    <div class="dica-usuario">
      💡 Dica: Seu acesso é o <strong>DDD + os 4 últimos dígitos</strong> do seu telefone.
    </div>
    
    <button id="btn-buscar" class="btn btn-destaque" onclick="buscarCliente()">
      🔍 ACESSAR PAINEL
    </button>

    <a href="https://wa.me/5547996315851?text=Olá!%20Esqueci%20meu%20código%20de%20usuário,%20poderia%20me%20ajudar?" target="_blank" class="btn-esqueci-dados">
      🤔 Não sei meu usuário / Esqueci meus dados
    </a>
  </div>
</div>

<script>
  // ===== LÓGICA DO RELÓGIO =====
  function updateTime() {
    const now = new Date();
    document.getElementById('liveClock').textContent = 
      String(now.getHours()).padStart(2, '0') + ':' + 
      String(now.getMinutes()).padStart(2, '0') + ':' + 
      String(now.getSeconds()).padStart(2, '0');

    document.getElementById('liveDate').textContent = 
      now.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace('.', '');
  }
  setInterval(updateTime, 1000);
  updateTime();

  // ===== LÓGICA DE BUSCA E REDIRECIONAMENTO =====
  function buscarCliente() {
    const usuarioInput = document.getElementById('input-usuario');
    const usuario = usuarioInput.value.trim();
    
    if (!usuario) { 
      alert('⚠️ Por favor, digite seu código de usuário.'); 
      usuarioInput.focus();
      return; 
    }

    const btn = document.getElementById('btn-buscar');
    const originalText = btn.innerHTML;
    
    // Efeito de carregamento
    btn.innerHTML = '⏳ Localizando...'; 
    btn.disabled = true;
    
    // Simula um delay rápido para UX e faz o redirecionamento
    setTimeout(() => {
      // Redireciona para o arquivo do cliente específico na pasta /clientes/
      window.location.href = `./clientes/${usuario}.html`;
      
      // Restaura o botão caso o usuário volte pelo navegador
      btn.innerHTML = originalText; 
      btn.disabled = false;
    }, 500);
  }

  // Permite pesquisar apertando "Enter" no teclado
  function verificarEnter(event) {
    if (event.key === 'Enter') {
      buscarCliente();
    }
  }
</script>

</body>
</html>
