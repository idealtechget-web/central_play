        /* ===== VARIÁVEIS ===== */
        :root {
            --bg-card: rgba(20, 29, 45, 0.85);
            --bg-body: #0a0f1d;
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text-light: #cbd5e1;
            --text-muted: #94a3b8;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* ===== BACKGROUND ANIMADO ===== */
        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(96, 165, 250, 0.05), transparent 25%);
            background-size: 200% 200%;
            animation: bgDrift 15s ease infinite alternate;
        }

        @keyframes bgDrift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* ===== CARD DO PLAYER ===== */
        .player-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* ===== HEADER E LOGO ===== */
        .logo { font-weight: 800; font-size: 2rem; letter-spacing: 1px; color: #fff; line-height: 1; }
        .logo span { color: var(--primary); }
        .sub-logo { margin-top: 0.5rem; font-size: 0.7rem; letter-spacing: 4px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 2rem; }

        /* ===== ANIMAÇÃO VISUAL DO RÁDIO ===== */
        .visualizer {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
            transition: all var(--transition);
            position: relative;
        }

        .playing .visualizer {
            animation: pulse-glow 2s infinite;
            border-color: var(--primary);
            color: #fff;
            background: var(--primary);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.5);
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* ===== SELETOR DE ESTAÇÕES ===== */
        .station-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .station-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .radio-select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0d1524;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            appearance: none;
            -webkit-appearance: none;
        }

        .radio-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .radio-select option {
            background: #0d1524;
            color: #fff;
            padding: 10px;
        }

        /* ===== CONTROLES (PLAY E VOLUME) ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }

        .play-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .play-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.6);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            margin-left: 20px;
        }

        .volume-icon {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* ===== BOTÃO VOLTAR ===== */
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid transparent;
        }

        .btn-voltar:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-voltar i {
            font-size: 1.1rem;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }

    </style>
</head>
<body>

    <!-- Background Animado -->
    <div class="bg-animation"></div>

    <!-- Card do Player -->
    <div class="player-card" id="playerWrapper">
        
        <!-- Header / Logo -->
        <div class="logo">IDEAL<span>TECH</span></div>
        <div class="sub-logo">Rádio Web</div>

        <!-- Animação Central -->
        <div class="visualizer">
            <i class="ph ph-headphones"></i>
        </div>

        <!-- Seletor de Rádios -->
        <div class="station-group">
            <label for="stationSelect">Estação Atual</label>
            <select class="radio-select" id="stationSelect">
                <option value="http://uk7.internet-radio.com:8022/;" selected>Groove & Funk (UK7)</option>
                <option value="https://az1.mediacp.eu:443/100coverslounge">100 Covers Lounge</option>
                <option value="http://stream1.dancewave.online:8080/dance.mp3">Dance Attack (Electro)</option>
                <option value="http://us4.internet-radio.com:8076/;">House & Dance (US4)</option>
                <option value="http://uk7.internet-radio.com:8151/;">Música Eletrônica/Lounge</option>
                <option value="https://play.streamafrica.net/lofiradio">Office & Foco (Lo-Fi)</option>
                <option value="https://stream.nightride.fm/nightride.m4a">Synthwave (Hacker Vibe)</option>
                <option value="https://stream.ibizaglobalradio.com/ibizaglobalradio.mp3">Ibiza Global (House)</option>
            </select>
        </div>

        <!-- Controles de Áudio -->
        <div class="controls">
            <button class="play-btn" id="playBtn" title="Play/Pause">
                <i class="ph ph-play" id="playIcon"></i>
            </button>
            
            <div class="volume-container">
                <i class="ph ph-speaker-low volume-icon"></i>
                <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.1" title="Volume">
            </div>
        </div>

        <!-- Botão Voltar para o HUB -->
        <a href="#" onclick="window.close(); return false;" class="btn-voltar">
            <i class="ph ph-arrow-left"></i> Voltar ao Hub
        </a>

        <!-- Tag de Áudio Oculta -->
        <audio id="audioStream" src="http://uk7.internet-radio.com:8022/;" preload="auto" autoplay></audio>

    </div>

    <footer>
        IDEALTECH © 2026 ⎯ GESTÃO E TECNOLOGIA
    </footer>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const stationSelect = document.getElementById('stationSelect');
        const playerWrapper = document.getElementById('playerWrapper');
        const volumeControl = document.getElementById('volumeControl');
        
        let isPlaying = false;
        
        // Volume travado em 10%
        audio.volume = 0.1;

        // Atualiza volume e ícone visual
        volumeControl.addEventListener('input', (e) => { 
            audio.volume = e.target.value; 
            
            const volIcon = document.querySelector('.volume-icon');
            if(audio.volume == 0) {
                volIcon.className = "ph ph-speaker-x volume-icon";
            } else if (audio.volume > 0.5) {
                volIcon.className = "ph ph-speaker-high volume-icon";
            } else {
                volIcon.className = "ph ph-speaker-low volume-icon";
            }
        });

        // Função Iniciar
        const iniciarRadio = () => {
            if (!isPlaying) {
                audio.src = stationSelect.value;
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = 'ph ph-pause';
                    playerWrapper.classList.add('playing');
                }).catch(() => {
                    console.log("Aguardando interação para iniciar rádio.");
                });
            }
        };

        // Função Pausar
        const pausarRadio = () => {
            audio.pause(); 
            audio.src = ''; // Limpa o buffer
            isPlaying = false;
            playIcon.className = 'ph ph-play'; 
            playerWrapper.classList.remove('playing');
        };

        // Evento de Clique no Botão Play
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                iniciarRadio();
            } else {
                pausarRadio();
            }
        });

        // Trocar de Rádio
        stationSelect.addEventListener('change', () => {
            if (isPlaying) { 
                audio.src = stationSelect.value; 
                audio.play(); 
            }
        });

        // Autoplay Inteligente (Gatilhos estendidos para incluir mousemove e scroll)
        window.addEventListener('DOMContentLoaded', () => { 
            setTimeout(iniciarRadio, 500); 
        });
        
        const eventosInteracao = ['click', 'touchstart', 'keydown', 'mousemove', 'wheel'];

        const iniciarAoInteragir = () => {
            if (!isPlaying && audio.paused) {
                iniciarRadio();
            }
            // Remove listeners após o primeiro acionamento para economizar memória
            eventosInteracao.forEach(evento => {
                window.removeEventListener(evento, iniciarAoInteragir);
            });
        };

        // Adiciona ouvintes a múltiplas interações
        eventosInteracao.forEach(evento => {
            window.addEventListener(evento, iniciarAoInteragir, { once: true });
        });
    </script>
</body>

        // Atualiza volume e ícone visual
        volumeControl.addEventListener('input', (e) => { 
            audio.volume = e.target.value; 
            
            const volIcon = document.querySelector('.volume-icon');
            if(audio.volume == 0) {
                volIcon.className = "ph ph-speaker-x volume-icon";
            } else if (audio.volume > 0.5) {
                volIcon.className = "ph ph-speaker-high volume-icon";
            } else {
                volIcon.className = "ph ph-speaker-low volume-icon";
            }
        });

        // Função Iniciar
        const iniciarRadio = () => {
            if (!isPlaying) {
                audio.src = stationSelect.value;
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.className = 'ph ph-pause';
                    playerWrapper.classList.add('playing');
                }).catch(() => {
                    console.log("Aguardando interação para iniciar rádio.");
                });
            }
        };

        // Função Pausar
        const pausarRadio = () => {
            audio.pause(); 
            audio.src = ''; // Limpa o buffer
            isPlaying = false;
            playIcon.className = 'ph ph-play'; 
            playerWrapper.classList.remove('playing');
        };

        // Evento de Clique no Botão Play
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                iniciarRadio();
            } else {
                pausarRadio();
            }
        });

        // Trocar de Rádio
        stationSelect.addEventListener('change', () => {
            if (isPlaying) { 
                audio.src = stationSelect.value; 
                audio.play(); 
            }
        });

        // Autoplay Inteligente (Gatilhos estendidos para incluir mousemove e scroll)
        window.addEventListener('DOMContentLoaded', () => { 
            setTimeout(iniciarRadio, 500); 
        });
        
        const eventosInteracao = ['click', 'touchstart', 'keydown', 'mousemove', 'wheel'];

        const iniciarAoInteragir = () => {
            if (!isPlaying && audio.paused) {
                iniciarRadio();
            }
            // Remove listeners após o primeiro acionamento para economizar memória
            eventosInteracao.forEach(evento => {
                window.removeEventListener(evento, iniciarAoInteragir);
            });
        };

        // Adiciona ouvintes a múltiplas interações
        eventosInteracao.forEach(evento => {
            window.addEventListener(evento, iniciarAoInteragir, { once: true });
        });
    </script>
</body>
</html>
