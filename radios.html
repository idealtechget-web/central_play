<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdealTech ⎯ Rádio Web</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-card: rgba(20, 29, 45, 0.85);
            --bg-body: #0a0f1d;
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text-light: #cbd5e1;
            --text-muted: #94a3b8;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        .bg-animation {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(96, 165, 250, 0.05), transparent 25%);
            background-size: 200% 200%;
            animation: bgDrift 15s ease infinite alternate;
        }

        @keyframes bgDrift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .player-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .logo { font-weight: 800; font-size: 2rem; letter-spacing: 1px; color: #fff; line-height: 1; }
        .logo span { color: var(--primary); }
        .sub-logo { margin-top: 0.5rem; font-size: 0.7rem; letter-spacing: 4px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 2rem; }

        .visualizer {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
            transition: all var(--transition);
            position: relative;
        }

        .playing .visualizer {
            animation: pulse-glow 2s infinite;
            border-color: var(--primary);
            color: #fff;
            background: var(--primary);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.5);
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        .station-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .station-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .radio-select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0d1524;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            appearance: none;
            -webkit-appearance: none;
        }

        .radio-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .radio-select option {
            background: #0d1524;
            color: #fff;
            padding: 10px;
        }

        .controls-wrapper {
            margin-bottom: 2rem;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 10px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .play-btn {
            background: var(--primary);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .play-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.6);
        }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            margin-left: 20px;
        }

        .volume-icon { font-size: 1.2rem; color: var(--text-muted); }

        .volume-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: var(--transition);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid transparent;
        }

        .btn-voltar:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="player-card" id="playerWrapper">
        
        <div class="logo">IDEAL<span>TECH</span></div>
        <div class="sub-logo">Rádio Web</div>

        <div class="visualizer">
            <i class="ph ph-headphones"></i>
        </div>

        <div class="station-group">
            <label for="stationSelect">Estação Atual</label>
            <select class="radio-select" id="stationSelect">
                <option value="https://play.streamafrica.net/lofiradio" selected>Office & Foco (Lo-Fi)</option>
                <option value="https://ice1.somafm.com/indiepop-128-mp3">Indie Pop Rocks (SomaFM)</option>
                <option value="https://ice1.somafm.com/beatblender-128-mp3">Beat Blender (House & Club)</option>
                <option value="https://ice1.somafm.com/cliqhop-128-mp3">Cliqhop (Eletrônica & Future Garage)</option>
                <option value="https://ice1.somafm.com/suburbsofgoa-128-mp3">Suburbs of Goa (World Chill)</option>
                <option value="https://ice1.somafm.com/bootliquor-128-mp3">Boot Liquor (Americana & Rock)</option>
                
            </select>
        </div>

        <div class="controls-wrapper">
            <div class="controls">
                <button class="play-btn" id="playBtn" title="Play/Pause">
                    <i class="ph ph-play" id="playIcon"></i>
                </button>
                
                <div class="volume-container">
                    <i class="ph ph-speaker-low volume-icon"></i>
                    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.1" title="Volume">
                </div>
            </div>
            <div id="errorMsg" class="error-message">
                <i class="ph ph-warning-circle"></i> Erro ao conectar com a rádio.
            </div>
        </div>

        <a href="#" onclick="window.close(); return false;" class="btn-voltar">
            <i class="ph ph-arrow-left"></i> Voltar ao Hub
        </a>

        <audio id="audioStream" preload="none"></audio>

    </div>

    <footer>
        IDEALTECH © 2026 ⎯ GESTÃO E TECNOLOGIA
    </footer>

    <script>
        const audio = document.getElementById('audioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const stationSelect = document.getElementById('stationSelect');
        const playerWrapper = document.getElementById('playerWrapper');
        const volumeControl = document.getElementById('volumeControl');
        const errorMsg = document.getElementById('errorMsg');
        
        let isPlaying = false;
        audio.volume = 0.1;

        volumeControl.addEventListener('input', (e) => { 
            audio.volume = e.target.value; 
            const volIcon = document.querySelector('.volume-icon');
            if(audio.volume == 0) {
                volIcon.className = "ph ph-speaker-x volume-icon";
            } else if (audio.volume > 0.5) {
                volIcon.className = "ph ph-speaker-high volume-icon";
            } else {
                volIcon.className = "ph ph-speaker-low volume-icon";
            }
        });

        const resetUI = () => {
            playIcon.className = 'ph ph-play';
            playerWrapper.classList.remove('playing');
            isPlaying = false;
        };

        const iniciarRadio = () => {
            errorMsg.style.display = 'none';
            playIcon.className = 'ph ph-spinner-gap spin';
            
            if (audio.src !== stationSelect.value) {
                audio.src = stationSelect.value;
            }

            audio.play().catch(err => {
                console.log("Aguardando interação do usuário.");
            });
        };

        const pausarRadio = () => {
            audio.pause(); 
            audio.src = '';
            resetUI();
        };

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                iniciarRadio();
            } else {
                pausarRadio();
            }
        });

        stationSelect.addEventListener('change', () => {
            resetUI();
            errorMsg.style.display = 'none';
            audio.src = stationSelect.value;
            iniciarRadio();
        });

        audio.addEventListener('waiting', () => {
            playIcon.className = 'ph ph-spinner-gap spin';
            playerWrapper.classList.remove('playing');
        });

        audio.addEventListener('playing', () => {
            isPlaying = true;
            playIcon.className = 'ph ph-pause';
            playerWrapper.classList.add('playing');
            errorMsg.style.display = 'none';
        });

        audio.addEventListener('error', () => {
            resetUI();
            errorMsg.style.display = 'flex';
        });

        const eventosInteracao = ['click', 'touchstart', 'keydown', 'mousemove', 'wheel'];
        const iniciarAoInteragir = () => {
            if (!isPlaying && audio.paused) {
                iniciarRadio();
            }
            eventosInteracao.forEach(evento => {
                window.removeEventListener(evento, iniciarAoInteragir);
            });
        };

        eventosInteracao.forEach(evento => {
            window.addEventListener(evento, iniciarAoInteragir, { once: true });
        });
    </script>
</body>
</html>
